[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-slr"
version = "0.9.1-alpha.0"
description = "Systematic Literature Review framework for academic research"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Mouadh", email = "your.email@example.com"}
]
keywords = ["systematic-review", "literature-review", "academic", "research", "slr"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing",
]

dependencies = [
    "pydantic>=2.0,<3.0",
    "requests>=2.31,<3.0",
    "pandas>=2.0,<3.0",
    "python-dotenv>=1.0,<2.0",
    "click>=8.0,<9.0",
    "pyyaml>=6.0,<7.0",
    "tqdm>=4.65,<5.0",
]

[project.optional-dependencies]
# Advanced deduplication with embeddings (large dependencies)
semantic = [
    "sentence-transformers>=2.0,<3.0",
    "faiss-cpu>=1.7,<2.0",
    "torch>=2.0,<3.0",
]

# Development dependencies
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=4.0,<5.0",
    "pytest-benchmark>=4.0,<5.0",
    "pytest-mock>=3.12,<4.0",
    "black>=23.0,<25.0",
    "isort>=5.0,<6.0",
    "flake8>=7.0,<8.0",
    "mypy>=1.0,<2.0",
    "pre-commit>=3.0,<4.0",
    "mkdocs>=1.5,<2.0",
    "mkdocs-material>=9.0,<10.0",
    "mkdocstrings[python]>=0.24,<1.0",
]

# All optional dependencies
all = ["simple-slr[semantic,dev]"]

[project.urls]
Homepage = "https://github.com/yourusername/simple_slr"
Documentation = "https://simple-slr.readthedocs.io"
Repository = "https://github.com/yourusername/simple_slr"
Issues = "https://github.com/yourusername/simple_slr/issues"

[project.scripts]
slr = "slr.cli.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["slr*"]
exclude = ["tests*", "docs*", "examples*"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=slr",
    "--cov-report=term-missing",
    "--cov-report=html",
]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "benchmark: marks tests as benchmarks",
]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true
known_first_party = ["slr"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "pandas.*",
    "sentence_transformers.*",
    "faiss.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["slr"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

