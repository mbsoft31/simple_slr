[pytest]
# Pytest configuration for Simple SLR

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    --verbose
    --strict-markers
    --strict-config
    --tb=short
    --disable-warnings

# Coverage options (when using --cov)
# Run with: pytest --cov=slr --cov-report=html
[coverage:run]
source = slr
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */site-packages/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov

# Markers for test categorization
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, may need network)
    slow: Slow tests (may take several seconds)
    benchmark: Performance benchmark tests
    provider: Tests for specific providers
    dedup: Deduplication tests
    export: Export functionality tests

# Timeout (requires pytest-timeout)
timeout = 300
timeout_method = thread

# Warnings
filterwarnings =
    error
    ignore::UserWarning
    ignore::DeprecationWarning
